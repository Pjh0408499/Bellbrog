<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #111;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header h1 {
      margin: 0;
      font-size: 1.4em;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }
    main {
      display: flex;
      justify-content: center;
      padding: 60px 20px;
      gap: 60px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto;
    }
    .contact-info, form {
      flex: 1 1 400px;
    }
    .contact-info {
      font-size: 1em;
    }
    .contact-info div {
      margin-bottom: 10px;
    }
    .contact-info button {
      margin-top: 8px;
      padding: 6px 14px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      border-radius: 25px;
      font-size: 0.9em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contact-info button:hover {
      background: #111;
      color: #fff;
    }
    form input, form textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1em;
      background: #fff;
    }
    form button {
      display: block;
      margin-top: 10px;
      background: #111;
      color: #fff;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }
    form button:hover {
      background: #333;
    }
    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.9em;
      background-color: #f2f2f2;
      color: #666;
      margin-top: 60px;
    }
    .toggle-dark {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .dark-mode {
      background: #111;
      color: #eee;
    }
    .dark-mode form input,
    .dark-mode form textarea {
      background: #222;
      color: #eee;
      border-color: #444;
    }
    .dark-mode form button,
    .dark-mode .contact-info button {
      background: #eee;
      color: #111;
    }
    .dark-mode .contact-info button:hover {
      background: #fff;
    }
    .dark-mode header {
      background: #111;
      border-color: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="subjects.html">Subjects</a>
      <a href="posts.html">Posts</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main data-aos="fade-up" data-aos-delay="200">
    <div class="contact-info" data-aos="fade-right" data-aos-delay="300">
      <h2>Contact Info</h2>
      <div>📧 Email: <strong id="email">pjh0408499@naver.com</strong></div>
      <button onclick="copyEmail()">📋 Copy Email</button>
      <div>📞 Phone: <strong>010-0000-0000</strong></div>
      <div>🌐 GitHub: <a href="https://github.com/Pjh0408499" target="_blank">github.com/Pjh0408499</a></div>
    </div>

    <form action="https://formspree.io/f/your-form-id" method="POST" data-aos="fade-left" data-aos-delay="500">
      <h2>Send a Message</h2>
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Jonghyeong Park. All rights reserved.</p>
  </footer>

  <button class="toggle-dark" onclick="toggleDarkMode()">🌓 Toggle Dark Mode</button>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('dark-mode', isDark);
    }

    window.onload = function () {
      if (localStorage.getItem('dark-mode') === 'true') {
        document.body.classList.add('dark-mode');
      }
    };

    function copyEmail() {
      const email = document.getElementById("email").textContent;
      navigator.clipboard.writeText(email).then(() => {
        alert("Email address copied to clipboard!");
      });
    }
  </script>
</body>
</html>
