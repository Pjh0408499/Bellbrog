<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Helvetica Neue', sans-serif; background: #fff; color: #111; transition: background 0.3s, color 0.3s; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 1000; }
    header h1 { margin: 0; font-size: 1.4em; }
    nav a { margin-left: 20px; text-decoration: none; color: inherit; font-weight: 500; }
    section { padding: 60px 40px; }
    .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .post-card { background: #fafafa; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .post-card h3 { margin-top: 0; font-size: 1.5em; }
    .post-card p { color: #555; font-size: 1em; line-height: 1.6; margin-bottom: 20px; }
    .post-card a { display: inline-block; padding: 8px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 5px; font-size: 0.9em; }
    footer { text-align: center; padding: 30px 20px; font-size: 0.9em; background-color: #f2f2f2; color: #666; margin-top: 60px; }
    .toggle-dark { position: fixed; bottom: 20px; right: 20px; padding: 10px; background: #111; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .dark-mode { background: #111; color: #eee; }
    .dark-mode .post-card { background: #222; }
    .dark-mode .post-card a { background: #eee; color: #111; }
    .dark-mode header { background: #111; border-color: #444; }
  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="subjects.html">Subjects</a>
      <a href="posts.html">Posts</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section>
    <h2 data-aos="fade-up">My Posts</h2>
    <div class="post-grid" id="post-container" data-aos="fade-up">
      <!-- Posts will be loaded here via JavaScript -->
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Jonghyeong Park. All rights reserved.</p>
  </footer>

  <button class="toggle-dark" onclick="toggleDarkMode()">🌓 Toggle Dark Mode</button>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('dark-mode', isDark);
    }

    window.onload = function () {
      if (localStorage.getItem('dark-mode') === 'true') {
        document.body.classList.add('dark-mode');
      }
    };

    async function loadPosts() {
      const res = await fetch('_posts/sample.md');
      const text = await res.text();
      const container = document.getElementById('post-container');
      container.innerHTML = `
        <div class="post-card">
          <h3>첫 번째 글</h3>
          <p>${text.substring(0, 100)}...</p>
          <a href="#">Read More</a>
        </div>
      `;
    }

    loadPosts();
  </script>
</body>
</html>
